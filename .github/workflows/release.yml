name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback: dispatch AT a tag ref (gh workflow run release.yml --ref vX.Y.Z)
  # for when a tag-push event is lost (first seen: the 2026-08-06 Actions outage
  # swallowed v2.0.4's push events; re-pushing the tag did not regenerate them).
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
